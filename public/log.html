<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Viewer — read-log v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h2>▸ Log Viewer</h2>
    <div class="sidebar-nav">
      <a class="nav-tab active" href="/log">Logs</a>
      <a class="nav-tab" href="/sql" target="_blank">SQL</a>
    </div>
  </div>
  <select class="group-select" id="groupSelect"></select>
  <div class="scroll-list" id="fileList"></div>
</aside>

<!-- ═══════════════ MAIN ═══════════════ -->
<main class="main">
  <div class="toolbar">
    <button id="btnConfig">⚙ Config</button>
    <button id="btnRefresh">↻ Refresh</button>
    <button id="btnAnsi" class="on">🎨 strip</button>
    <span class="status" id="statusBar">● connected</span>
  </div>
  <div class="tab-bar" id="tabBar"></div>
  <div class="content-area" id="contentArea">
    <div class="empty-state" id="emptyState">
      <span class="icon">◈</span>
      <span>Select a log file from the sidebar</span>
      <span style="font-size:10px;color:var(--text-dim)">● 端口存活 &nbsp; ⚡ 有新日志输出</span>
    </div>
  </div>
</main>
</div>

<!-- ═══════════════ CONFIG MODAL ═══════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span>config.json</span>
      <button id="btnModalClose">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="configText" spellcheck="false"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="btnModalCancel">Cancel</button>
      <button class="btn-primary" id="btnModalSave">Save & Apply</button>
    </div>
  </div>
</div>

<script>
// ── Utilities ────────────────────────────────────────────
const $  = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
function esc(s)    { return s.replace(/[^a-zA-Z0-9]/g, '_'); }
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let config       = { groups: {} };
let currentGroup = null;
let tabs         = {};
let activeFile   = null;
let activityMap  = {};
let autoScroll   = {};
let portStatusMap = {};   // port → alive (由 SSE 实时更新)
// ANSI 模式: 'strip' | 'raw' | 'color'
let ansiMode = localStorage.getItem('log-ansi') || 'strip';
// 兼容旧值 'on'/'off' → 'strip'/'raw'
if (ansiMode === 'on') ansiMode = 'strip';
if (ansiMode === 'off') ansiMode = 'raw';
if (!['strip','raw','color'].includes(ansiMode)) ansiMode = 'strip';

// 简易 ANSI → HTML（零依赖）
const ANSI_FG = { 30:'black',31:'red',32:'green',33:'yellow',34:'blue',35:'magenta',36:'cyan',37:'white',
                   90:'bright-black',91:'bright-red',92:'bright-green',93:'bright-yellow',
                   94:'bright-blue',95:'bright-magenta',96:'bright-cyan',97:'bright-white' };
function ansiToHtml(s) {
  let out = '', cls = [], i = 0;
  while (i < s.length) {
    if (s[i] === '\x1b' && s[i+1] === '[') {
      const end = s.indexOf('m', i);
      if (end === -1) { out += escHtml(s[i]); i++; continue; }
      const code = s.slice(i+2, end);
      if (code === '0' || code === '') { cls = []; }
      else {
        code.split(';').forEach(c => {
          const n = parseInt(c);
          if (ANSI_FG[n]) cls = cls.filter(x => !x.includes('-fg')).concat('ansi-'+ANSI_FG[n]+'-fg');
          else if (n === 1) cls.push('ansi-bold');
          else if (n === 2) cls.push('ansi-dim');
          else if (n === 3) cls.push('ansi-italic');
          else if (n === 4) cls.push('ansi-underline');
        });
      }
      i = end + 1;
    } else {
      if (cls.length) { out += '<span class="'+cls.join(' ')+'">'; }
      const start = i;
      while (i < s.length && s[i] !== '\x1b') i++;
      out += escHtml(s.slice(start, i));
      if (cls.length) out += '</span>';
    }
  }
  return out;
}
function ansiStrip(s) { return s.replace(/\x1b\[[0-9;]*m/g, ''); }

function ansiRender(s) {
  if (ansiMode === 'strip') return ansiStrip(s);
  if (ansiMode === 'color') return ansiToHtml(s);
  return s;
}

function setLogContent(el, text) {
  if (ansiMode === 'color') {
    el.innerHTML = ansiRender(text);
  } else {
    el.textContent = ansiRender(text);
  }
}

function appendLogContent(fp, text) {
  if (!tabs[fp]) return;
  if (ansiMode === 'color') {
    tabs[fp].logEl.innerHTML += ansiRender(text);
  } else {
    tabs[fp].logEl.textContent += ansiRender(text);
  }
}

// ── SSE ──────────────────────────────────────────────────
const sse = new EventSource('/api/stream');
sse.onopen  = () => { $('#statusBar').textContent = '● connected'; };
sse.onerror = () => { $('#statusBar').textContent = '○ reconnecting'; };
sse.onmessage = (e) => {
  const data = JSON.parse(e.data);

  // 批量日志变更（v2 优化：一次 poll 周期合并为数组）
  if (Array.isArray(data)) {
    for (const d of data) handleLogMessage(d);
    return;
  }

  // 端口状态变更 → 实时更新 dot
  if (data.type === 'port-status' && data.ports) {
    for (const [portStr, alive] of Object.entries(data.ports)) {
      const port = parseInt(portStr);
      portStatusMap[port] = !!alive;
    }
    updateAllDots();
    return;
  }

  // 单条日志消息（向后兼容）
  handleLogMessage(data);
};

function handleLogMessage(d) {
  if (!d.file) return;
  if (d.changed) {
    activityMap[d.file] = d.timestamp || Date.now();
    const blink = document.querySelector(`[data-blink="${esc(d.file)}"]`);
    if (blink) blink.style.display = 'inline';
  }
  if (d.content && tabs[d.file]) appendLog(d.file, d.content);
}

// ── API ──────────────────────────────────────────────────
async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  return res.json();
}

// ── Init ─────────────────────────────────────────────────
async function init() {
  // 恢复 ANSI 按钮状态
  updateAnsiBtn();

  config = await api('/api/config');
  buildGroupSelect();
  await loadFiles();
  setInterval(tick, 500);
}

// ── Group Select ─────────────────────────────────────────
function buildGroupSelect() {
  const sel = $('#groupSelect');
  sel.innerHTML = '';
  const keys = Object.keys(config.groups || {});
  if (!keys.length) { sel.innerHTML = '<option>No groups</option>'; return; }
  keys.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = config.groups[k].name;
    sel.appendChild(o);
  });
  // 恢复上次选中的分组
  const saved = localStorage.getItem('log-group');
  if (saved && keys.includes(saved)) currentGroup = saved;
  else currentGroup = keys[0];
  sel.value = currentGroup;
  sel.onchange = () => { currentGroup = sel.value; localStorage.setItem('log-group', currentGroup); loadFiles(); };
}

// ── File List ────────────────────────────────────────────
async function loadFiles() {
  const logs = currentGroup ? (config.groups[currentGroup]?.logs || []) : [];
  const fl = $('#fileList'); fl.innerHTML = '';

  // 获取排序后的列表
  let sorted = [];
  try { sorted = await api('/api/logs'); } catch {}
  const groupFiles = new Set(logs.map(l => l.file));
  sorted = sorted.filter(s => groupFiles.has(s.file));

  sorted.forEach(log => {
    // 更新 portStatusMap（从 API 同步 + SSE 更新）
    if (log.port) portStatusMap[log.port] = log.alive;

    const div = document.createElement('div');
    div.className = 'file-item list-item';
    div.dataset.file = log.file;
    // dot: green=port alive, red=port dead, gray=no port, yellow=file missing
    let dotClass = 'dot';
    if (log.alive) dotClass += ' alive';
    else if (log.port) dotClass += ' dead';
    else if (!log.exists) dotClass += ' missing';

    div.innerHTML = `<span class="${dotClass}" data-dot="${esc(log.file)}"></span>
                     <span class="name">${escHtml(log.name)}</span>
                     <span class="blink" data-blink="${esc(log.file)}" style="display:none;font-size:9px;color:var(--warn);">⚡</span>`;
    div.onclick = () => openTab(log.file, log.name);
    fl.appendChild(div);
  });
}

// ── Tabs ─────────────────────────────────────────────────
async function openTab(fp, name) {
  if (tabs[fp]) { switchTab(fp); return; }
  $('#emptyState').style.display = 'none';

  const tb = document.createElement('div');
  tb.className = 'tab'; tb.dataset.file = esc(fp);
  tb.onclick = () => switchTab(fp);

  const td = document.createElement('span'); td.className = 'tab-dot'; td.dataset.tabdot = esc(fp); tb.appendChild(td);
  const tn = document.createElement('span'); tn.textContent = name; tb.appendChild(tn);
  const tc = document.createElement('span'); tc.className = 'tab-close'; tc.textContent = '✕';
  tc.onclick = (e) => { e.stopPropagation(); closeTab(fp); };
  tb.appendChild(tc);
  $('#tabBar').appendChild(tb);

  const pn = document.createElement('div'); pn.className = 'log-panel'; pn.dataset.panel = fp;
  const lc = document.createElement('div'); lc.className = 'log-content'; lc.dataset.log = fp;
  pn.appendChild(lc);

  const ct = document.createElement('div'); ct.className = 'log-controls';
  ct.innerHTML = `<button class="on" data-autobtn="${esc(fp)}">● Auto-scroll</button>
                  <button data-clear="${esc(fp)}">Clear</button>
                  <span class="line-count" data-lines="${esc(fp)}">0 lines</span>`;
  ct.querySelector(`[data-autobtn]`).onclick = () => toggleAuto(fp);
  ct.querySelector(`[data-clear]`).onclick  = () => clearLog(fp);
  pn.appendChild(ct);
  $('#contentArea').appendChild(pn);

  tabs[fp] = { name, panel: pn, logEl: lc, linesEl: ct.querySelector(`[data-lines]`) };
  autoScroll[fp] = true;

  try {
    const data = await api(`/api/log/content?file=${encodeURIComponent(fp)}`);
    if (data.content) { setLogContent(lc, data.content); updateLineCount(fp); lc.scrollTop = lc.scrollHeight; }
  } catch (er) { lc.textContent = `[Error: ${er.message}]`; }

  lc.onscroll = () => {
    const atBottom = lc.scrollHeight - lc.scrollTop - lc.clientHeight < 50;
    autoScroll[fp] = atBottom;
    updateAutoBtn(fp);
  };
  switchTab(fp);
}

function switchTab(fp) {
  Object.values(tabs).forEach(t => t.panel.style.display = 'none');
  $$('.tab').forEach(t => t.classList.remove('current'));
  if (tabs[fp]) { tabs[fp].panel.style.display = 'flex'; const tb = document.querySelector(`.tab[data-file="${esc(fp)}"]`); if (tb) tb.classList.add('current'); activeFile = fp; }
}

function closeTab(fp) {
  if (!tabs[fp]) return;
  tabs[fp].panel.remove(); const tb = document.querySelector(`.tab[data-file="${esc(fp)}"]`); if (tb) tb.remove();
  delete tabs[fp]; delete autoScroll[fp];
  if (Object.keys(tabs).length) { switchTab(Object.keys(tabs).pop() || ''); } else { activeFile = null; $('#emptyState').style.display = 'flex'; }
}

function appendLog(fp, text) { appendLogContent(fp, text); updateLineCount(fp); if (autoScroll[fp]) tabs[fp].logEl.scrollTop = tabs[fp].logEl.scrollHeight; }
function clearLog(fp) { if (!tabs[fp]) return; tabs[fp].logEl.textContent = ''; updateLineCount(fp); }
function toggleAuto(fp) { autoScroll[fp] = !autoScroll[fp]; updateAutoBtn(fp); if (autoScroll[fp] && tabs[fp]) tabs[fp].logEl.scrollTop = tabs[fp].logEl.scrollHeight; }
function updateAutoBtn(fp) { const btn = document.querySelector(`[data-autobtn="${esc(fp)}"]`); if (btn) { btn.className = autoScroll[fp] ? 'on' : ''; btn.textContent = autoScroll[fp] ? '● Auto-scroll' : '○ Auto-scroll'; } }
function updateLineCount(fp) { if (!tabs[fp]) return; const n = (tabs[fp].logEl.textContent.match(/\n/g) || []).length; tabs[fp].linesEl.textContent = n.toLocaleString() + ' lines'; }

// ── Tick: blink indicator + tab dot + port refresh ───────
let lastPortRefresh = 0;

function tick() {
  const now = Date.now(), T = 3000; // 3 秒无写入则灭

  // 闪烁指示器（⚡ 闪电）
  document.querySelectorAll('[data-blink]').forEach(el => {
    const fk = el.dataset.blink; let fp = null;
    for (const f of Object.keys(activityMap)) { if (esc(f) === fk) { fp = f; break; } }
    el.style.display = (fp && (now - (activityMap[fp] || 0)) < T) ? 'inline' : 'none';
  });

  // Tab 标签的点
  document.querySelectorAll('[data-tabdot]').forEach(d => {
    const fk = d.dataset.tabdot; let fp = null;
    for (const f of Object.keys(activityMap)) { if (esc(f) === fk) { fp = f; break; } }
    if (!fp) return;
    d.classList.toggle('tab-active', (now - (activityMap[fp] || 0)) < T);
  });

  // ★ 每 5 秒从 API 更新端口 dot（SSE 兜底）
  if (now - lastPortRefresh > 5000) {
    lastPortRefresh = now;
    refreshPortStatus();
  }
}

async function refreshPortStatus() {
  let sorted = [];
  try { sorted = await api('/api/logs'); } catch { return; }
  const statusMap = {};
  sorted.forEach(log => {
    if (log.port) statusMap[log.file] = log.alive;
    if (log.port) portStatusMap[log.port] = log.alive;
  });
  updateAllDots();
}

/** 根据 portStatusMap 刷新所有文件列表的 dot 指示器（不重建 DOM，仅更新有端口的项） */
function updateAllDots() {
  const logs = currentGroup ? (config.groups[currentGroup]?.logs || []) : [];
  document.querySelectorAll('[data-dot]').forEach(el => {
    const item = el.closest('.file-item');
    if (!item) return;
    const fp = item.dataset.file;
    const logEntry = logs.find(l => l.file === fp);
    if (!logEntry || !logEntry.port) return; // 无端口的不处理

    el.className = 'dot';
    if (portStatusMap[logEntry.port]) el.className += ' alive';
    else el.className += ' dead';
  });
}

// ── Config Modal ─────────────────────────────────────────
$('#btnConfig').onclick = () => { $('#configText').value = JSON.stringify(config, null, 2); $('#modalOverlay').style.display = 'flex'; $('#configText').focus(); };
function closeConfig() { $('#modalOverlay').style.display = 'none'; }
$('#btnModalClose').onclick = closeConfig;
$('#btnModalCancel').onclick = closeConfig;
$('#modalOverlay').onclick = (e) => { if (e.target === $('#modalOverlay')) closeConfig(); };
$('#btnModalSave').onclick = async () => {
  try {
    const nc = JSON.parse($('#configText').value);
    await api('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(nc) });
    config = nc; buildGroupSelect(); await loadFiles(); closeConfig();
  } catch (er) { alert('Invalid JSON: ' + er.message); }
};
$('#btnRefresh').onclick = async () => { config = await api('/api/config'); buildGroupSelect(); await loadFiles(); };

function updateAnsiBtn() {
  const btn = $('#btnAnsi');
  const labels = { strip: '🎨 strip', raw: '🔤 raw', color: '🌈 color' };
  btn.textContent = labels[ansiMode] || '🎨 strip';
  btn.className = ansiMode === 'strip' ? 'on' : (ansiMode === 'color' ? 'danger' : '');
}

$('#btnAnsi').onclick = () => {
  ansiMode = ansiMode === 'strip' ? 'raw' : ansiMode === 'raw' ? 'color' : 'strip';
  localStorage.setItem('log-ansi', ansiMode);
  updateAnsiBtn();
  // 重新加载所有已打开标签页
  Object.keys(tabs).forEach(fp => {
    api(`/api/log/content?file=${encodeURIComponent(fp)}`).then(data => {
      if (data.content) setLogContent(tabs[fp].logEl, data.content);
    });
  });
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeConfig();
  if ((e.metaKey || e.ctrlKey) && e.key === 'w' && activeFile) { e.preventDefault(); closeTab(activeFile); }
});

init();
</script>
</body>
</html>
