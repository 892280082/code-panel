<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <!-- Rounded dark terminal background -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bg)" stroke="#22ee66" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Top bar dots -->
  <circle cx="12" cy="12" r="1.6" fill="#f44747"/>
  <circle cx="18" cy="12" r="1.6" fill="#f0a030"/>
  <circle cx="24" cy="12" r="1.6" fill="#22ee66"/>
  <!-- Prompt + code brackets `</>` in green glow -->
  <text x="32" y="42" font-family="ui-monospace, 'Fira Code', Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle" fill="#22ee66">&lt;/&gt;</text>
  <!-- Subtle underscore cursor -->
  <rect x="44" y="34" width="6" height="2" fill="#22ee66" opacity="0.85"/>
</svg>
