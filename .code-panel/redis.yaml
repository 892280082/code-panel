# ── redis.yaml —— 本项目「Redis 连接」(面板 /redis 查看缓存/清缓存) ──────────
# 修改即生效。host/port/password 支持 ${VAR:默认值} 环境变量占位符(跨机器切换)。
# 字段:
#   id        连接唯一标识(如 hq / school,与 sql.yaml 平台 id 对齐)
