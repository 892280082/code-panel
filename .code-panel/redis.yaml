#   db        默认聚焦的 db 号(可选;方舟按实例分 db 50-58)
#   notes     备注(可选)
#
# 示例(去掉注释即生效):
#   connections:
#     - { id: hq, name: 总部缓存(db50), host: "${CODE_PANEL_REDIS_HOST:127.0.0.1}",
#         port: 6379, password: "${CODE_PANEL_REDIS_PASSWORD:改我}", db: 50, notes: 平台 hq }
connections: []
