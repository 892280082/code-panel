# ── git.yaml —— 本项目「git 仓库」(面板 /git 变更/diff/历史/文件浏览) ─────
# ⚠️ path 写「相对项目根」的相对路径;'.' = 项目根本身(即本项目仓库)。
#    面板读取时自动补成绝对。
# id 是面板路由引用键(如 /api/git/diff/<id>):只有一个仓库时写项目名即可,多仓库各取不同短名。
#
# 示例:
#   repos:
#     - { id: myproj, name: myproj, path: ., notes: 本项目仓库 }
repos:
  # 自举:本仓库即面板本体(skill 源码),path '.' = 项目根
  - { id: code-panel, name: code-panel, path: ., notes: 面板本体仓库(自举) }
