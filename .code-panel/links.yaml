# ── links.yaml —— 本项目「快捷方式/Quick Links」(/log 顶栏 🔗 下拉) ──────
# 提交式、随仓库走,想改就编辑本文件,面板只负责「展示 + 打开」。修改即生效。
# 按「分组」存放常用地址;每个链接可带 1..N 个访问地址(如 内网/域名/测试 多环境)。
#
# 字段:
#   groups:          分组列表,每项:
#     name           组名(如 认证 / 资源)
#     items:         组内快捷链接,每项:
#       name         链接名(如 认证登录 / OSS 控制台)
#       urls:        该链接可访问的地址列表(1..N),每项:
#         label      可选,环境/入口标识(如 内网 / 域名);不写则面板直接显示 url
#         url        访问地址:可完整 URL(带 http:// 或 https://),
#                    也可只写「裸域名/主机 + 路径」(如 dev.example.com/auth/login),
#                    面板打开时自动补 http:// 前缀
#
# 示例(去掉 # 即生效):
#   groups:
#     - name: 认证
#       items:
#         - name: 认证登录
#           urls:
#             - { label: 内网, url: "http://127.0.0.1:7129/auth/login" }
#             - { label: 域名, url: "dev.example.com/auth/login" }
#         - name: HQ 登录
#           urls:
#             - { label: 域名, url: "http://dev.example.com/hq/login" }
#     - name: 资源
#       items:
#         - { name: OSS 控制台, urls: [ { url: "http://dev.example.com/resource" } ] }
groups:
  # 自举:面板自己的入口(listen 全接口 → 本机回环 + 局域网 192.0.2.10 都通)
  - name: 面板
    items:
      - name: code-panel 日志台
        urls:
          - { label: 本机,   url: "http://127.0.0.1:3008/log" }
          - { label: 局域网, url: "http://192.0.2.10:3008/log" }
      - name: SQL 审批
        urls:
          - { label: 本机, url: "http://127.0.0.1:3008/sql" }
      - name: Git 面板
        urls:
          - { label: 本机, url: "http://127.0.0.1:3008/git" }
      - name: PRD 目录
        urls:
          - { label: 本机, url: "http://127.0.0.1:3008/prd" }
