<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{计划名} · {页面名}</title>
<style>
  /* 自包含样式：白卡 + 标题栏 + 搜索行 + 表格 + 操作列 + 分页 */
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f3f5;color:#1f2329;padding:20px}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:20px;margin-bottom:16px}
  .panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:16px}
  .panel-h{font-size:14px;font-weight:700;margin-bottom:12px}
  /* ...按实际页面补组件样式... */
</style>
</head>
<body>
<div class="wrap">
  <h1>{页面标题}</h1>
  <div class="panel">
    <div class="panel-h">{区块标题}</div>
    <!-- 按业务逻辑画线框：表格/表单/操作按钮 -->
  </div>
</div>
</body>
</html>
